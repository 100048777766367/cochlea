name: Vòng Đời Ốc Tai Sinh Học (Cochlea HA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '45 */6 * * *' # Chạy lệch nhịp với Mắt và Não

permissions:
  contents: write

jobs:
  run-cochlea:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Ốc Tai
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # NẤC 1: XÚC TU PHẢ HỆ (TÌM NÃO GIA ĐÌNH)
      - name: Xúc tu vươn vòi tìm Não phả hệ
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python receptors/cascade_receptor.py

      # NẤC 3: ANTEN SỢI NẤM TOÀN CẦU (NẾU NÃO GIA ĐÌNH VẮNG MẶT)
      - name: Anten bắt sóng Bộ Não toàn cầu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python receptors/mesh_receptor.py

      # NẤC 2: MÀNG MIỄN DỊCH LỌC ĐẠO HÀM CHỐNG NỔ GRADIENT
      - name: Màng miễn dịch kiểm định đạo hàm
        run: python receptors/contract_receptor.py

      # VẬN HÀNH ỐC TAI (HẤP THỤ ĐẠO HÀM & LẮNG NGHE SÓNG ÂM)
      - name: Vận hành Động cơ Ốc Tai
        run: |
          python cochlea_engine.py

      # LƯU VẾT TÍCH XUNG THÍNH GIÁC VÀO GIT (BỌC THÉP CHỐNG XUNG ĐỘT)
      - name: Phát xung thính giác lên môi trường mạng
        run: |
          git config --global user.name "Cochlea-Ear-Bot"
          git config --global user.email "bot@cochlea.node"
          git add synapses/ synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "👂 [Xung Thính Giác] Ốc tai vừa nghe xong chuỗi âm thanh [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "Không có biến đổi mới."
          fi
